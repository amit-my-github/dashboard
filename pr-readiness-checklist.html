<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PR to Master Readiness Checklist</title>

  <!-- Bootstrap 5 (light theme by default) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Small polish on top of Bootstrap */
    .section-card { border: 1px solid rgba(0,0,0,.08); }
    .progress { height: .6rem; }
    .check-row:hover { background: rgba(0,0,0,.02); }
    .sticky-toolbar { top: 0; z-index: 1020; }
    .muted { color: #6c757d; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>
</head>

<body class="bg-light">
  <header class="py-4 border-bottom bg-white">
    <div class="container">
      <h1 class="h4 mb-1">PR to Master Readiness Checklist</h1>
      <div class="muted">
        Progress is saved in your browser (<span class="mono">localStorage</span>).
      </div>
    </div>
  </header>

  <div class="bg-light border-bottom position-sticky sticky-toolbar">
    <div class="container py-3">
      <div class="d-flex flex-wrap gap-2 align-items-center">
        <button class="btn btn-outline-primary btn-sm" id="expandAll" type="button">Expand all</button>
        <button class="btn btn-outline-secondary btn-sm" id="collapseAll" type="button">Collapse all</button>
        <button class="btn btn-outline-success btn-sm" id="checkAllOpen" type="button">Check all (open)</button>
        <button class="btn btn-outline-danger btn-sm" id="reset" type="button">Reset all</button>
        <span class="badge text-bg-dark ms-auto" id="overall">Overall: 0 / 0</span>
      </div>
    </div>
  </div>

  <main class="container py-4">
    <div class="accordion" id="toc">

      <!-- 1) Code Quality -->
      <div class="accordion-item section-card" data-section>
        <h2 class="accordion-header" id="h1">
          <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#c1" aria-expanded="true" aria-controls="c1">
            <div class="w-100">
              <div class="d-flex justify-content-between align-items-center gap-3">
                <div>
                  <div class="fw-semibold">1) Code Quality</div>
                  <div class="muted small">Linting, readability, security basics</div>
                </div>
                <div class="text-end" style="min-width:140px;">
                  <div class="small muted"><span class="count">0/0</span></div>
                  <div class="progress mt-1">
                    <div class="progress-bar" style="width:0%"></div>
                  </div>
                </div>
              </div>
            </div>
          </button>
        </h2>
        <div id="c1" class="accordion-collapse collapse show" aria-labelledby="h1" data-bs-parent="#toc">
          <div class="accordion-body">
            <div class="list-group">
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="cq_1">
                <div>
                  <div class="fw-semibold">Run linter/formatter and fix violations</div>
                  <div class="muted small">No warnings ignored unless documented.</div>
                </div>
              </label>
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="cq_2">
                <div>
                  <div class="fw-semibold">Remove unused code / debug logs / untracked TODOs</div>
                  <div class="muted small">Keep codebase clean and reviewable.</div>
                </div>
              </label>
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="cq_3">
                <div>
                  <div class="fw-semibold">Error handling is clear (no silent failures)</div>
                  <div class="muted small">Good messages + correct status codes / exceptions.</div>
                </div>
              </label>
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="cq_4">
                <div>
                  <div class="fw-semibold">Security quick pass: no secrets committed; inputs validated</div>
                  <div class="muted small">Check configs, logs, and sample files too.</div>
                </div>
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- 2) Configuration -->
      <div class="accordion-item section-card" data-section>
        <h2 class="accordion-header" id="h2">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#c2" aria-expanded="false" aria-controls="c2">
            <div class="w-100">
              <div class="d-flex justify-content-between align-items-center gap-3">
                <div>
                  <div class="fw-semibold">2) Configuration</div>
                  <div class="muted small">Env vars, configs, deployment readiness</div>
                </div>
                <div class="text-end" style="min-width:140px;">
                  <div class="small muted"><span class="count">0/0</span></div>
                  <div class="progress mt-1">
                    <div class="progress-bar" style="width:0%"></div>
                  </div>
                </div>
              </div>
            </div>
          </button>
        </h2>
        <div id="c2" class="accordion-collapse collapse" aria-labelledby="h2" data-bs-parent="#toc">
          <div class="accordion-body">
            <div class="list-group">
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="cfg_1">
                <div>
                  <div class="fw-semibold">Configs correct for dev/test/prod (as applicable)</div>
                  <div class="muted small">Endpoints, toggles, logging level, timeouts.</div>
                </div>
              </label>
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="cfg_2">
                <div>
                  <div class="fw-semibold">Secrets stored in approved secret store (not in repo)</div>
                  <div class="muted small">Key Vault / secret manager / pipeline secret vars.</div>
                </div>
              </label>
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="cfg_3">
                <div>
                  <div class="fw-semibold">Version/build updated if required</div>
                  <div class="muted small">Package version, app version, release notes if needed.</div>
                </div>
              </label>
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="cfg_4">
                <div>
                  <div class="fw-semibold">Feature flags defaults confirmed + rollout plan noted</div>
                  <div class="muted small">Safe-by-default where possible.</div>
                </div>
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- 3) Unit Tests -->
      <div class="accordion-item section-card" data-section>
        <h2 class="accordion-header" id="h3">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#c3" aria-expanded="false" aria-controls="c3">
            <div class="w-100">
              <div class="d-flex justify-content-between align-items-center gap-3">
                <div>
                  <div class="fw-semibold">3) Unit Tests</div>
                  <div class="muted small">Automated tests for new/changed logic</div>
                </div>
                <div class="text-end" style="min-width:140px;">
                  <div class="small muted"><span class="count">0/0</span></div>
                  <div class="progress mt-1">
                    <div class="progress-bar" style="width:0%"></div>
                  </div>
                </div>
              </div>
            </div>
          </button>
        </h2>
        <div id="c3" class="accordion-collapse collapse" aria-labelledby="h3" data-bs-parent="#toc">
          <div class="accordion-body">
            <div class="list-group">
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="ut_1">
                <div>
                  <div class="fw-semibold">Add/update unit tests for new behavior and bug fixes</div>
                  <div class="muted small">Cover happy path + edge cases.</div>
                </div>
              </label>
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="ut_2">
                <div>
                  <div class="fw-semibold">Ensure tests are deterministic (no flaky dependencies)</div>
                  <div class="muted small">No real network/time randomness; use mocks/fakes.</div>
                </div>
              </label>
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="ut_3">
                <div>
                  <div class="fw-semibold">Run unit tests locally and confirm green</div>
                  <div class="muted small">Fix failures before PR/merge.</div>
                </div>
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- 4) Code Coverage -->
      <div class="accordion-item section-card" data-section>
        <h2 class="accordion-header" id="h4">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#c4" aria-expanded="false" aria-controls="c4">
            <div class="w-100">
              <div class="d-flex justify-content-between align-items-center gap-3">
                <div>
                  <div class="fw-semibold">4) Code Coverage</div>
                  <div class="muted small">Coverage checks + gaps reviewed</div>
                </div>
                <div class="text-end" style="min-width:140px;">
                  <div class="small muted"><span class="count">0/0</span></div>
                  <div class="progress mt-1">
                    <div class="progress-bar" style="width:0%"></div>
                  </div>
                </div>
              </div>
            </div>
          </button>
        </h2>
        <div id="c4" class="accordion-collapse collapse" aria-labelledby="h4" data-bs-parent="#toc">
          <div class="accordion-body">
            <div class="list-group">
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="cc_1">
                <div>
                  <div class="fw-semibold">Generate coverage report and meet threshold</div>
                  <div class="muted small">Confirm team policy is satisfied.</div>
                </div>
              </label>
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="cc_2">
                <div>
                  <div class="fw-semibold">Review uncovered critical paths and add tests if needed</div>
                  <div class="muted small">Error handling, boundary cases, permissions.</div>
                </div>
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- 5) GitHub PR format -->
      <div class="accordion-item section-card" data-section>
        <h2 class="accordion-header" id="h5">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#c5" aria-expanded="false" aria-controls="c5">
            <div class="w-100">
              <div class="d-flex justify-content-between align-items-center gap-3">
                <div>
                  <div class="fw-semibold">5) GitHub PR Format</div>
                  <div class="muted small">Template, description, links, reviewers</div>
                </div>
                <div class="text-end" style="min-width:140px;">
                  <div class="small muted"><span class="count">0/0</span></div>
                  <div class="progress mt-1">
                    <div class="progress-bar" style="width:0%"></div>
                  </div>
                </div>
              </div>
            </div>
          </button>
        </h2>
        <div id="c5" class="accordion-collapse collapse" aria-labelledby="h5" data-bs-parent="#toc">
          <div class="accordion-body">
            <div class="list-group">
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="pr_1">
                <div>
                  <div class="fw-semibold">PR title + description follow team convention</div>
                  <div class="muted small">Clear scope + intent; include "what/why".</div>
                </div>
              </label>
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="pr_2">
                <div>
                  <div class="fw-semibold">Link work items (ADO) + add screenshots/logs if relevant</div>
                  <div class="muted small">Traceability + review evidence.</div>
                </div>
              </label>
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="pr_3">
                <div>
                  <div class="fw-semibold">Add required reviewers/approvers</div>
                  <div class="muted small">Owners, codeowners, security reviewers (if needed).</div>
                </div>
              </label>
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="pr_4">
                <div>
                  <div class="fw-semibold">Confirm PR checks are passing</div>
                  <div class="muted small">CI build, lint, tests, scans.</div>
                </div>
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- 6) Testing -->
      <div class="accordion-item section-card" data-section>
        <h2 class="accordion-header" id="h6">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#c6" aria-expanded="false" aria-controls="c6">
            <div class="w-100">
              <div class="d-flex justify-content-between align-items-center gap-3">
                <div>
                  <div class="fw-semibold">6) Testing</div>
                  <div class="muted small">Manual/Integration/Regression as needed</div>
                </div>
                <div class="text-end" style="min-width:140px;">
                  <div class="small muted"><span class="count">0/0</span></div>
                  <div class="progress mt-1">
                    <div class="progress-bar" style="width:0%"></div>
                  </div>
                </div>
              </div>
            </div>
          </button>
        </h2>
        <div id="c6" class="accordion-collapse collapse" aria-labelledby="h6" data-bs-parent="#toc">
          <div class="accordion-body">
            <div class="list-group">
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="tst_1">
                <div>
                  <div class="fw-semibold">Smoke test key flows (happy path + common edges)</div>
                  <div class="muted small">Local or test environment.</div>
                </div>
              </label>
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="tst_2">
                <div>
                  <div class="fw-semibold">Run integration/E2E tests (or document why not needed)</div>
                  <div class="muted small">Be explicit for reviewers/QA.</div>
                </div>
              </label>
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="tst_3">
                <div>
                  <div class="fw-semibold">Regression risk reviewed and validated</div>
                  <div class="muted small">What could break? Validate those paths.</div>
                </div>
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- 7) Acceptance Criteria -->
      <div class="accordion-item section-card" data-section>
        <h2 class="accordion-header" id="h7">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#c7" aria-expanded="false" aria-controls="c7">
            <div class="w-100">
              <div class="d-flex justify-content-between align-items-center gap-3">
                <div>
                  <div class="fw-semibold">7) Acceptance Criteria</div>
                  <div class="muted small">Ensure story/task is truly done</div>
                </div>
                <div class="text-end" style="min-width:140px;">
                  <div class="small muted"><span class="count">0/0</span></div>
                  <div class="progress mt-1">
                    <div class="progress-bar" style="width:0%"></div>
                  </div>
                </div>
              </div>
            </div>
          </button>
        </h2>
        <div id="c7" class="accordion-collapse collapse" aria-labelledby="h7" data-bs-parent="#toc">
          <div class="accordion-body">
            <div class="list-group">
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="ac_1">
                <div>
                  <div class="fw-semibold">Every AC is met and verifiable</div>
                  <div class="muted small">No "should be fine" items.</div>
                </div>
              </label>
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="ac_2">
                <div>
                  <div class="fw-semibold">Add evidence (screenshots/logs/test output/steps)</div>
                  <div class="muted small">Helps QA + future debugging.</div>
                </div>
              </label>
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="ac_3">
                <div>
                  <div class="fw-semibold">Non-functional checks considered (perf/a11y/etc.)</div>
                  <div class="muted small">Only what applies to your change.</div>
                </div>
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- 8) Teams -->
      <div class="accordion-item section-card" data-section>
        <h2 class="accordion-header" id="h8">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#c8" aria-expanded="false" aria-controls="c8">
            <div class="w-100">
              <div class="d-flex justify-content-between align-items-center gap-3">
                <div>
                  <div class="fw-semibold">8) Communicate in Teams group</div>
                  <div class="muted small">Notify stakeholders + handoff info</div>
                </div>
                <div class="text-end" style="min-width:140px;">
                  <div class="small muted"><span class="count">0/0</span></div>
                  <div class="progress mt-1">
                    <div class="progress-bar" style="width:0%"></div>
                  </div>
                </div>
              </div>
            </div>
          </button>
        </h2>
        <div id="c8" class="accordion-collapse collapse" aria-labelledby="h8" data-bs-parent="#toc">
          <div class="accordion-body">
            <div class="list-group">
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="tm_1">
                <div>
                  <div class="fw-semibold">Post summary: what changed, why, impact/risk</div>
                  <div class="muted small">Keep it short and actionable.</div>
                </div>
              </label>
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="tm_2">
                <div>
                  <div class="fw-semibold">Share testing status + environment tested</div>
                  <div class="muted small">Local/dev/test/prod-like.</div>
                </div>
              </label>
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="tm_3">
                <div>
                  <div class="fw-semibold">Mention owners/reviewers + rollout/feature flag instructions</div>
                  <div class="muted small">So others can deploy/support safely.</div>
                </div>
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- 9) ADO -->
      <div class="accordion-item section-card" data-section>
        <h2 class="accordion-header" id="h9">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#c9" aria-expanded="false" aria-controls="c9">
            <div class="w-100">
              <div class="d-flex justify-content-between align-items-center gap-3">
                <div>
                  <div class="fw-semibold">9) ADO (Azure DevOps) Updates</div>
                  <div class="muted small">Comment, link PR, update status</div>
                </div>
                <div class="text-end" style="min-width:140px;">
                  <div class="small muted"><span class="count">0/0</span></div>
                  <div class="progress mt-1">
                    <div class="progress-bar" style="width:0%"></div>
                  </div>
                </div>
              </div>
            </div>
          </button>
        </h2>
        <div id="c9" class="accordion-collapse collapse" aria-labelledby="h9" data-bs-parent="#toc">
          <div class="accordion-body">
            <div class="list-group">
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="ado_1">
                <div>
                  <div class="fw-semibold">Add ADO comment: summary + testing + limitations</div>
                  <div class="muted small">Make it easy for others to understand quickly.</div>
                </div>
              </label>
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="ado_2">
                <div>
                  <div class="fw-semibold">Link PR/commits to work item + move to correct state</div>
                  <div class="muted small">Ready for QA / Done / Ready to Deploy, etc.</div>
                </div>
              </label>
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="ado_3">
                <div>
                  <div class="fw-semibold">Attach evidence + note AC coverage</div>
                  <div class="muted small">Screenshots/logs + which AC is satisfied by what.</div>
                </div>
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- 10) Final Gate -->
      <div class="accordion-item section-card" data-section>
        <h2 class="accordion-header" id="h10">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#c10" aria-expanded="false" aria-controls="c10">
            <div class="w-100">
              <div class="d-flex justify-content-between align-items-center gap-3">
                <div>
                  <div class="fw-semibold">10) Final Gate (before master)</div>
                  <div class="muted small">Last checks before merge/push</div>
                </div>
                <div class="text-end" style="min-width:140px;">
                  <div class="small muted"><span class="count">0/0</span></div>
                  <div class="progress mt-1">
                    <div class="progress-bar" style="width:0%"></div>
                  </div>
                </div>
              </div>
            </div>
          </button>
        </h2>
        <div id="c10" class="accordion-collapse collapse" aria-labelledby="h10" data-bs-parent="#toc">
          <div class="accordion-body">
            <div class="list-group">
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="fg_1">
                <div>
                  <div class="fw-semibold">Branch is up to date with master; conflicts resolved</div>
                  <div class="muted small">Rebase/merge per team rule.</div>
                </div>
              </label>
              <label class="list-group-item d-flex gap-2 align-items-start check-row">
                <input class="form-check-input mt-1" type="checkbox" data-id="fg_2">
                <div>
                  <div class="fw-semibold">Required approvals obtained; policies satisfied</div>
                  <div class="muted small">Build gates, checks, required reviewers.</div>
                </div>
              </label>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const STORAGE_KEY = "pr_master_readiness_checklist_v1";

    const overall = document.getElementById("overall");
    const expandAll = document.getElementById("expandAll");
    const collapseAll = document.getElementById("collapseAll");
    const checkAllOpen = document.getElementById("checkAllOpen");
    const reset = document.getElementById("reset");

    function $all(sel, root=document) { return Array.from(root.querySelectorAll(sel)); }
    function boxes(root=document) { return $all('input[type="checkbox"][data-id]', root); }

    function loadState() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
      catch { return {}; }
    }
    function saveState(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }

    function applyState() {
      const s = loadState();
      for (const cb of boxes()) cb.checked = !!s[cb.dataset.id];
    }

    function updateSection(sectionEl) {
      const b = boxes(sectionEl);
      const done = b.filter(x => x.checked).length;
      const total = b.length;

      sectionEl.querySelector(".count").textContent = `${done}/${total}`;
      const pct = total ? Math.round((done/total)*100) : 0;
      sectionEl.querySelector(".progress-bar").style.width = `${pct}%`;
    }

    function updateOverall() {
      const b = boxes();
      const done = b.filter(x => x.checked).length;
      overall.textContent = `Overall: ${done} / ${b.length}`;
    }

    function updateAll() {
      $all("[data-section]").forEach(updateSection);
      updateOverall();
    }

    document.addEventListener("change", (e) => {
      const t = e.target;
      if (!(t instanceof HTMLInputElement)) return;
      if (!t.matches('input[type="checkbox"][data-id]')) return;

      const s = loadState();
      s[t.dataset.id] = t.checked;
      saveState(s);

      const section = t.closest("[data-section]");
      if (section) updateSection(section);
      updateOverall();
    });

    expandAll.addEventListener("click", () => {
      $all(".accordion-collapse").forEach(el => new bootstrap.Collapse(el, { show: true }));
    });

    collapseAll.addEventListener("click", () => {
      $all(".accordion-collapse.show").forEach(el => new bootstrap.Collapse(el, { toggle: true }));
    });

    checkAllOpen.addEventListener("click", () => {
      const s = loadState();
      const openBodies = $all(".accordion-collapse.show");
      for (const body of openBodies) {
        for (const cb of boxes(body)) {
          cb.checked = true;
          s[cb.dataset.id] = true;
        }
        const section = body.closest("[data-section]");
        if (section) updateSection(section);
      }
      saveState(s);
      updateOverall();
    });

    reset.addEventListener("click", () => {
      if (!confirm("Reset ALL checklist items?")) return;
      localStorage.removeItem(STORAGE_KEY);
      applyState();
      updateAll();
    });

    // init
    applyState();
    updateAll();
  </script>
</body>
</html>
